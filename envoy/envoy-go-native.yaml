# Envoy config for the native Go header filter variant (Task 4).
# Listener 0.0.0.0:10000 -> cluster backend:8080.
# The compiled plugin (filters/go-native/bench-go.so) is mounted
# at /lib/bench-go.so by the test harness / compose setup (Task 6).
# Requires the contrib image (envoyproxy/envoy:contrib-v1.40-latest):
# the golang http filter is not in the distroless build.
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
static_resources:
  listeners:
  - name: ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          server_header_transformation: PASS_THROUGH
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: "backend:8080"
          http_filters:
          - name: envoy.filters.http.golang
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
              library_id: bench-go-id
              library_path: /lib/bench-go.so
              plugin_name: bench-go
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: "backend:8080"
    connect_timeout: 5s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: "backend:8080"
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8080
